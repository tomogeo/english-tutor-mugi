<style>
/* Layout: one-screen app — classroom scene fills the screen, a top bar of round buttons, her speech bubble, and a chat dock at the bottom; sheets slide up over the scene. Deliberately dark (the original app's monochrome look), single theme. */
:root {
  --ink: #f4f3ee;          /* text on dark */
  --muted: #a9a8a1;
  --panel: #161615;        /* sheets and dock */
  --panel-2: #22221f;      /* inputs, rows */
  --line: #3a3a35;
  --chalk: #f4f3ee;        /* primary buttons (white on black, like chalk) */
  --chalk-ink: #141413;
  --good: #7fc497;
  --bad: #e58a80;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-en: "Nunito", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: #0f0f12; color: var(--ink); font-family: var(--font-ui); font-size: 16px; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.app { position: relative; height: 100%; overflow: hidden; }

/* scene */
.stage { position: absolute; inset: 0; overflow: hidden; }
.stage::before { content: ""; position: absolute; inset: -40px; background: url("img/classroom.webp") center 62% / cover no-repeat; filter: blur(22px) brightness(.55); }
.scene { position: absolute; background: url("img/classroom.webp") center / 100% 100% no-repeat; }
.figure { position: absolute; }
.figure img { position: absolute; display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.figure .mouth { width: auto; }

/* top bar */
.top { position: absolute; z-index: 5; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); }
.who { flex: 1; min-width: 0; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.who b { display: block; font-family: var(--font-en); font-size: 22px; font-weight: 800; letter-spacing: .02em; }
.who small { color: #ddd; font-size: 13px; }
.round { position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: rgba(20,20,19,.88); display: grid; place-items: center; cursor: pointer; }
.round svg { width: 22px; height: 22px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--chalk); color: var(--chalk-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* bubble */
.bubble { align-self: center; width: 100%; box-sizing: border-box;
  max-width: 640px; max-height: 30vh; overflow-y: auto; padding: 12px 16px; border-radius: 18px; background: rgba(20,20,19,.9); line-height: 1.5; cursor: pointer; }
.bubble b { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.en { font-family: var(--font-en); font-weight: 600; }

/* chat dock */
.dock { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.history { max-height: 42vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 20px; background: rgba(20,20,19,.92); margin: 0; list-style: none; }
.history li { max-width: 86%; padding: 9px 13px; border-radius: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.history .me { align-self: flex-end; background: var(--chalk); color: var(--chalk-ink); }
.history .her { align-self: flex-start; background: var(--panel-2); cursor: pointer; }
.history .tip { align-self: flex-start; background: transparent; border: 1px dashed var(--line); cursor: default; }
.history .tip small { display: block; font-weight: 700; color: var(--muted); }
.history .hint { align-self: center; color: var(--muted); font-size: 14px; text-align: center; max-width: 100%; }
.notes { font-size: 13px; color: #ddd; text-align: center; text-shadow: 0 1px 4px #000; min-height: 0; }
.notes:empty { display: none; }
.bar { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 28px; background: var(--panel); }
.bar input { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 22px; background: var(--panel-2); color: var(--ink); padding: 0 14px; font-size: 16px; }
.pill { height: 44px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 22px; background: var(--panel-2); cursor: pointer; flex: none; display: grid; place-items: center; }
.pill svg { width: 20px; height: 20px; }
.pill.on { background: var(--chalk); color: var(--chalk-ink); }
.send { background: var(--chalk); color: var(--chalk-ink); font-weight: 700; padding: 0 16px; }
.send:disabled { opacity: .45; cursor: default; }

/* sheets */
.veil { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 82%; overflow-y: auto; background: var(--panel); border-radius: 22px 22px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet > * { flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head strong { font-size: 22px; }
.x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 24px; line-height: 1; }
.sheet h3 { margin: 6px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row > span { min-width: 0; }
.row small { display: block; color: var(--muted); font-size: 13px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; padding: 10px 12px; background: transparent; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--chalk); color: var(--chalk-ink); font-weight: 700; }
.small-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 8px 14px; cursor: pointer; flex: none; }
.small-btn.danger { color: var(--bad); }
.small-btn.on { background: var(--chalk); color: var(--chalk-ink); }
select, .sheet input[type=text] { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 16px; max-width: 100%; }
input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--chalk); flex: none; }
input[type=range] { flex: 1; accent-color: var(--chalk); }
.chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.char { border: 2px solid var(--line); background: var(--panel-2); border-radius: 16px; padding: 10px 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.char[aria-pressed="true"] { border-color: var(--chalk); }
.char img { height: 96px; width: auto; object-fit: contain; }
.char b { font-family: var(--font-en); }
.char small { color: var(--muted); font-size: 12px; text-align: center; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card p { margin: 0; line-height: 1.55; }
.target { align-self: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: transparent; cursor: pointer; text-align: left; }
.target[aria-pressed="true"] { background: var(--chalk); color: var(--chalk-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.typed { display: flex; gap: 8px; }
.typed input { flex: 1; min-width: 0; }
.verdict.ok { color: var(--good); }
.verdict.ng { color: var(--bad); }
.muted { color: var(--muted); font-size: 14px; }
.lvl { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; margin-right: 6px; font-family: var(--font-en); }
.lk-en { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 18px; }
.speak { border: 0; background: transparent; cursor: pointer; padding: 2px; }
.speak svg { width: 20px; height: 20px; }
.banner { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); top: 64px; width: min(560px, calc(100% - 32px)); padding: 12px 14px; border-radius: 14px; background: #3a2a1a; color: #ffe1bd; font-size: 14px; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

// ---------------------------------------------------------------- her voice (the device's own speech)
const ttsOk = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function enVoices() {
  if (!ttsOk) return [];
  return speechSynthesis.getVoices().filter((v) => /^en([-_]|$)/i.test(v.lang))
    .sort((a, b) => (/en[-_]us/i.test(b.lang) - /en[-_]us/i.test(a.lang)) || a.name.localeCompare(b.name));
}
function pickVoice() {
  const vs = enVoices();
  if (prefs.voice) { const v = vs.find((x) => x.name === prefs.voice); if (v) return v; }
  const us = vs.filter((v) => /en[-_]us/i.test(v.lang));
  const pool = us.length ? us : vs;
  const male = CHARS[prefs.char].male;
  const fem = /samantha|ava|allison|susan|zira|jenny|aria|emma|karen|moira|tessa|victoria|female|google us english/i;
  return pool.find((v) => /premium|enhanced|natural|neural/i.test(v.name) && fem.test(v.name) !== male) || pool.find((v) => fem.test(v.name) !== male) || pool[0] || null;
}
let speakGen = 0;
function say(text) {
  if (!ttsOk) { note('這個瀏覽器不支援語音朗讀'); return; }
  const t = text.replace(/（[^（）]*）/g, ' ').replace(/[()"“”*_~`<>]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!t) return;
  stopMic();
  speechSynthesis.cancel();
  const g = ++speakGen;
  const u = new SpeechSynthesisUtterance(t);
  const v = pickVoice();
  u.lang = v?.lang || 'en-US';
  if (v) u.voice = v;
  u.rate = prefs.rate;
  u.pitch = CHARS[prefs.char].male && !prefs.voice ? 0.85 : 1;
  const end = () => { if (g === speakGen) setTalking(false); };
  u.onstart = () => { if (g === speakGen) setTalking(true); };
  u.onend = end; u.onerror = end;
  speechSynthesis.speak(u);
  // some browsers never fire onstart: animate anyway, and stop by length as a fallback
  setTalking(true);
  setTimeout(end, Math.max(4000, t.length * 110 / prefs.rate));
}
if (ttsOk) speechSynthesis.addEventListener?.('voiceschanged', () => { if (sheetKind === 'settings') renderSheet(); });

// ---------------------------------------------------------------- speech recognition (may be refused inside the viewer's frame)
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recTarget = null;
function startMic(lang, onFinal, onPartial) {
  if (!Rec) { note('這個瀏覽器不能語音輸入。請改用手機鍵盤上的麥克風，或直接打字。', 9000); return false; }
  stopMic();
  try { speechSynthesis.cancel(); } catch { /* none */ }
  rec = new Rec();
  rec.lang = lang; rec.interimResults = true; rec.continuous = false;
  recTarget = { onFinal, onPartial };
  rec.onresult = (ev) => {
    let fin = '', part = '';
    for (const r of ev.results) (r.isFinal ? (fin += r[0].transcript) : (part += r[0].transcript));
    if (part) recTarget?.onPartial?.(part);
    if (fin) recTarget?.onFinal?.(fin.trim());
  };
  rec.onerror = (ev) => {
    const blocked = ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture';
    note(blocked ? '這個頁面拿不到麥克風。請改用手機鍵盤上的麥克風（語音輸入），效果一樣。' : ev.error === 'no-speech' ? '沒有聽到聲音，再試一次。' : '語音辨識失敗，請再試一次。', 9000);
  };
  rec.onend = () => { rec = null; if ($('notes').textContent.startsWith('聆聽中')) note(''); syncMicButtons(); };
  try { rec.start(); } catch { rec = null; note('語音輸入沒辦法啟動。請改用手機鍵盤上的麥克風。', 9000); return false; }
  syncMicButtons();

}

async function send(raw) {
  const text = raw.trim();
  if (!text || busy) return;
  const sample = await getSample();
  if (!sample) { showUnavailable(); return; }
  const c = CHARS[prefs.char], lines = chatOf(prefs.char);
  lines.push({ from: 'me', text, sent: `［情境：${timeLabel()}］${text}` });
  busy = true; streamText = '…'; $('input').value = '';
  renderChat();
  const turns = [{ role: 'user', content: rulesFor(c) }];
  for (const l of lines.slice(-24)) {
    if (l.tip) continue;
    turns.push(l.from === 'me' ? { role: 'user', content: l.sent || l.text } : { role: 'assistant', content: l.sent || l.text });
  }
  turns[turns.length - 1] = { role: 'user', content: turns[turns.length - 1].content + '\n\n（請只回覆那個 JSON 物件。）' };
  ctl = new AbortController();
  try {
    const { text: out } = await sample(turns, {
      modelTier: prefs.tier, cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { const p = partialText(t); if (p) { streamText = p; renderChat(); } },
    });
    const r = parseReply(out);
    streamText = '';
    if (!r) { note(ERRORS.empty_completion); return; }
    lines.push({ from: 'her', text: lineText(r.segments), sent: sentOf(r.segments) });
    if (r.tip) {
      const t = splitTip(r.tip);
      lines.push({ from: 'her', tip: true, text: t.text });
      tips.unshift({ id: Date.now().toString(36), text: t.text, targets: t.targets, said: text, mastered: false, tries: 0 });
      saveTips();
    }
    saveChats();
    if (prefs.speak) say(r.segments.map((s) => s.text).join(' '));
  } catch (e) {
    streamText = '';
    lines.pop();
    $('input').value = text;
    const m = errText(e);
    if (m) note(m, 9000);
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') showUnavailable(m);
  } finally {
    busy = false; ctl = null;
    renderChat();
  }
}

const normEn = (s) => s.normalize('NFKC').toLowerCase().replace(/[‘’]/g, "'").replace(/[\s　]+/g, '').replace(/[!-/:-@[-`{-~、-〃「-』…（）！？]/g, '');

    head('速查'),
    el('form', { class: 'typed', onsubmit: (e) => { e.preventDefault(); doLookup(); } },
      el('input', { type: 'text', id: 'lkq', value: listening && lookupState.live ? lookupState.live : lookupState.q, maxlength: '200', placeholder: '例如：這句話英文怎麼說、used to', 'aria-label': '要查的內容', autocomplete: 'off', oninput: (e) => { lookupState.q = e.target.value; } }),
      el('button', { type: 'submit', class: 'small-btn', disabled: lookupState.busy, text: lookupState.busy ? '查詢中…' : '查' })),
    el('div', { class: 'actions' },
      seg('語音辨識語言', lookupState.lang, [['zh-TW', '中'], ['en-US', '英']], (v) => { lookupState.lang = v; renderSheet(); }),
      el('button', { type: 'button', class: 'small-btn' + (listening ? ' on' : ''), onclick: () => {
        if (listening) { stopMic(); return; }
        const ok = startMic(lookupState.lang, (t) => { lookupState.q = t; lookupState.live = ''; renderSheet(); }, (p) => { lookupState.live = p; renderSheet(); });
        if (ok) recTarget.where = 'lookup';
        renderSheet();
      }, text: listening ? '聆聽中…' : '語音輸入' })),
    lookupState.err ? el('div', { class: 'verdict ng', text: lookupState.err }) : null,
    el('div', { class: 'row' }, el('h3', { text: '查詢紀錄' }), lookups.length ? el('button', { type: 'button', class: 'small-btn danger', onclick: () => { lookups = []; saveLookups(); renderSheet(); }, text: '全部清除' }) : null),
    lookups.length ? null : el('p', { class: 'muted', text: '還沒有查過。輸入或說出想查的英文說法、單字、片語或文法。' }),
    lookups.map((e) => {
      const a = e.answer;
      return el('div', { class: 'card' },
        el('div', { class: 'row' }, el('b', { text: e.q }), el('button', { type: 'button', class: 'x', 'aria-label': `刪除「${e.q}」`, onclick: () => { lookups = lookups.filter((x) => x.id !== e.id); saveLookups(); renderSheet(); }, text: '×' })),
        a.message ? el('p', { text: a.message }) : null,
        a.items.map((it) => el('div', {}, el('div', { class: 'lk-en en' }, str(it.en), speakBtn(str(it.en))),
          el('p', {}, el('span', { class: 'lvl', text: str(it.level) || '其他' }), str(it.zh)), str(it.note) ? el('small', { class: 'muted', text: str(it.note) }) : null)),
        a.grammar.length ? el('h3', { text: '文法' }) : null,
        a.grammar.map((g) => el('div', {}, el('div', { class: 'lk-en en' }, str(g.point)), el('p', {}, el('span', { class: 'lvl', text: str(g.level) || '其他' }), str(g.explain)))),
        a.examples.length ? el('h3', { text: '例句' }) : null,
        a.examples.map((x) => el('div', {}, el('div', { class: 'lk-en en' }, str(x.en), speakBtn(str(x.en))), el('small', { class: 'muted', text: str(x.zh) }))));
    }),
    el('small', { class: 'muted', text: '級數依常見 CEFR 參考：A1 最簡單，C2 最難。' }),
  ];
}

// ---------------------------------------------------------------- wiring
$('form').addEventListener('submit', (e) => { e.preventDefault(); stopMic(); send($('input').value); });
$('btnTopic').addEventListener('click', openTopic);
$('btnHist').addEventListener('click', () => { prefs.histOpen = !prefs.histOpen; savePrefs(); renderChat(); });
$('btnLang').addEventListener('click', () => { prefs.stt = prefs.stt === 'en-US' ? 'zh-TW' : 'en-US'; savePrefs(); renderChat(); });
$('btnMic').addEventListener('click', () => {
  if (rec && recTarget?.where === 'chat') { stopMic(); return; }
  const base = $('input').value.trim();
  const join = (t) => (base ? base + ' ' : '') + t;
  const ok = startMic(prefs.stt, (t) => { $('input').value = join(t); $('input').focus(); }, (p) => { $('input').value = join(p); });
  if (ok) { recTarget.where = 'chat'; syncMicButtons(); note(prefs.stt === 'en-US' ? '聆聽中…（英文）' : '聆聽中…（中文）', 0); }
});
$('bubble').addEventListener('click', () => { const t = $('bubbleText').textContent; if (t && !busy) say(t); });
$('btnSettings').addEventListener('click', () => openSheet('settings'));
$('btnChar').addEventListener('click', () => openSheet('chars'));
$('btnTips').addEventListener('click', () => { tipTab = 'practice'; openSheet('tips'); });
$('btnLookup').addEventListener('click', () => openSheet('lookup'));
window.addEventListener('resize', layout);
new ResizeObserver(layout).observe($('stage'));

buildFigure();
renderChat();
getSample().then((s) => { if (!s) showUnavailable(); });
</script>
